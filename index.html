<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Spot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <i class="fa-solid fa-compact-disc fa-spin splash-icon"></i>
            <h1>Music Spot</h1>
            <p>Your Personal Cloud Audio</p>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app" class="hidden">
        
        <!-- Header & Search -->
        <header class="app-header">
            <div class="brand">
                <i class="fa-solid fa-music"></i>
                <span>Music Spot</span>
            </div>
            <div class="header-actions">
                <label for="fileInput" class="btn-icon" title="Add Music">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </label>
                <input type="file" id="fileInput" accept="audio/mp3,audio/mpeg,audio/wav,audio/*" class="hidden">
            </div>
        </header>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search by title, artist, or album...">
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="toast hidden"></div>

        <!-- Library Container -->
        <main class="library-container">
            <div class="library-header">
                <span id="library-count">0 Songs</span>
                <div class="filter-actions">
                    <button id="filterFavoritesBtn" class="btn-pill"><i class="fa-solid fa-heart"></i> Favorites</button>
                    <button id="filterRecentBtn" class="btn-pill active">All Songs</button>
                </div>
            </div>
            <div id="songList" class="song-list">
                <!-- Song items injected via JavaScript -->
            </div>
        </main>

        <!-- Player Bar -->
        <div id="player-bar" class="player-bar hidden">
            <div class="progress-container" id="progressBarContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="player-content">
                <div class="player-info" id="playerInfoTrigger">
                    <div class="player-art-placeholder"><i class="fa-solid fa-music"></i></div>
                    <div class="player-text">
                        <div class="player-title" id="playerTitle">Select a track</div>
                        <div class="player-artist" id="playerArtist">Unknown Artist</div>
                    </div>
                </div>
                <div class="player-controls">
                    <button id="prevBtn" class="btn-ctrl"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="playPauseBtn" class="btn-ctrl btn-play"><i class="fa-solid fa-play"></i></button>
                    <button id="nextBtn" class="btn-ctrl"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" id="navLibrary"><i class="fa-solid fa-list-ul"></i><span>Library</span></button>
            <button class="nav-item" id="navQueue"><i class="fa-solid fa-layer-group"></i><span>Queue</span></button>
            <button class="nav-item" id="navPitch"><i class="fa-solid fa-sliders"></i><span>Pitch</span></button>
            <button class="nav-item" id="navSpeed"><i class="fa-solid fa-gauge-high"></i><span>Speed</span></button>
        </nav>

        <!-- Queue Drawer -->
        <div id="queueModal" class="modal-bottom hidden">
            <div class="modal-header">
                <h3>Current Queue</h3>
                <button id="clearQueueBtn" class="btn-text">Clear</button>
                <button class="modal-close" data-close="queueModal">&times;</button>
            </div>
            <div id="queueList" class="queue-list"></div>
        </div>

        <!-- Pitch Drawer -->
        <div id="pitchModal" class="modal-bottom hidden">
            <div class="modal-header">
                <h3>Pitch Adjustment</h3>
                <button class="modal-close" data-close="pitchModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="control-row">
                    <span>Pitch Modulation</span>
                    <input type="checkbox" id="pitchToggle">
                </div>
                <div class="slider-display"><span id="pitchDisplay">0</span> Semitones</div>
                <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0" class="app-range">
                <div class="chip-row">
                    <button class="chip" data-pitch="-12">-12</button>
                    <button class="chip" data-pitch="-6">-6</button>
                    <button class="chip" data-pitch="-3">-3</button>
                    <button class="chip" data-pitch="0">0</button>
                    <button class="chip" data-pitch="3">+3</button>
                    <button class="chip" data-pitch="6">+6</button>
                    <button class="chip" data-pitch="12">+12</button>
                </div>
                <div class="input-row">
                    <input type="number" id="customPitchInput" placeholder="Custom (-12 to 12)" min="-12" max="12" step="0.1">
                    <button id="applyCustomPitchBtn" class="btn-pill">Apply</button>
                </div>
            </div>
        </div>

        <!-- Speed Drawer -->
        <div id="speedModal" class="modal-bottom hidden">
            <div class="modal-header">
                <h3>Speed Adjustment</h3>
                <button class="modal-close" data-close="speedModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="slider-display"><span id="speedDisplay">1.0</span>x Speed</div>
                <div class="chip-row">
                    <button class="chip speed-chip" data-speed="0.25">0.25x</button>
                    <button class="chip speed-chip" data-speed="0.5">0.5x</button>
                    <button class="chip speed-chip" data-speed="0.75">0.75x</button>
                    <button class="chip speed-chip active" data-speed="1.0">1.0x</button>
                    <button class="chip speed-chip" data-speed="1.25">1.25x</button>
                    <button class="chip speed-chip" data-speed="1.5">1.5x</button>
                    <button class="chip speed-chip" data-speed="2.0">2.0x</button>
                    <button class="chip speed-chip" data-speed="4.0">4.0x</button>
                </div>
                <div class="input-row">
                    <input type="number" id="customSpeedInput" placeholder="Custom (0.25 to 4.0)" min="0.25" max="4.0" step="0.05">
                    <button id="applyCustomSpeedBtn" class="btn-pill">Apply</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Hidden native audio element for decoding -->
    <audio id="audioElement" crossorigin="anonymous" class="hidden"></audio>

    <script type="module" src="app.js"></script>
</body>
</html>
